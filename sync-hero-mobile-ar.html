<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYNC — Hero Mobile AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --btn:#B8A38C; --btn-deep:#AE977F;
  --sec-fill:#F6F1EA; --sec-border:#C8B39D; --sec-text:#4B4037;
  --cream:#F4EFE6; --sec:#FBF8F2; --ink:#2A2622; --body:#5C554E; --line:#E3DCD0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#DED8CE;font-family:"IBM Plex Sans Arabic","Poppins",system-ui,sans-serif;
  color:var(--body);padding:24px;-webkit-font-smoothing:antialiased}

.stage{max-width:1200px;margin:0 auto}
.banner{position:relative;overflow:hidden;border-radius:20px;box-shadow:0 24px 60px -24px rgba(42,38,34,.4);background:var(--cream);display:none}
.banner.show{display:block}
.bimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.m-banner .bimg{object-fit:cover;object-position:center 112%}



/* text block */
.txt{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;z-index:6}
h1{color:var(--ink);font-weight:600;line-height:1.3;letter-spacing:-.01em}
.sup{color:var(--body);line-height:1.65}
.cta{display:flex;gap:12px}

/* button system — equal size */
.btn{display:inline-flex;align-items:center;justify-content:center;height:46px;width:190px;flex:0 0 auto;
  border-radius:13px;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap;
  font-family:inherit;transition:.18s ease;border:1.5px solid transparent;white-space:nowrap}
.d-en .btn,.m-en .btn,.d-en .link,.m-en .link{text-transform:uppercase;letter-spacing:.06em;font-size:13.5px}
.btn-primary{background:var(--btn);color:#fff;box-shadow:0 10px 24px -12px rgba(120,98,72,.55),0 1px 0 rgba(255,255,255,.18) inset}
.btn-primary:hover{background:var(--btn-deep);transform:translateY(-1px);box-shadow:0 14px 30px -12px rgba(120,98,72,.6),0 1px 0 rgba(255,255,255,.18) inset}
.btn-outline{background:var(--sec-fill);color:var(--sec-text);border-color:var(--sec-border);box-shadow:0 6px 16px -12px rgba(120,98,72,.35)}
.btn-outline:hover{background:#FBF7F1;border-color:var(--btn-deep)}



/* ===== DESKTOP (16:9) ===== */
.d-banner{aspect-ratio:16/9}
.d-banner .txt{width:44%;padding:0 5%}
.d-banner h1{font-size:clamp(26px,3.2vw,46px)}
.d-ar h1{font-size:clamp(23px,2.8vw,40px);line-height:1.5;font-weight:600;letter-spacing:0;text-align:right;direction:rtl;text-wrap:nowrap;align-self:stretch}
.d-banner .sup{font-size:clamp(14px,1.3vw,18px);margin:24px 0 36px;max-width:400px}
.d-ar .txt{right:0;align-items:flex-end;text-align:right}
.d-ar .sup{margin:26px 0 36px;line-height:1.7}
.d-en .txt{left:0;align-items:flex-start;text-align:left}

/* ===== MOBILE (4:5) ===== */
.m-banner{aspect-ratio:4/5;max-width:440px;margin:0 auto}
.m-banner::before{content:"";position:absolute;top:0;left:0;right:0;height:52%;z-index:2;background:linear-gradient(180deg,var(--cream) 55%,rgba(244,239,230,.0) 100%)}
.m-banner .txt{top:0;bottom:auto;left:0;right:0;padding:30px 30px 0;justify-content:flex-start;text-align:center;align-items:center}
.m-banner h1{font-size:clamp(22px,6vw,29px);line-height:1.34}
.m-banner .sup{font-size:clamp(12px,3.3vw,14px);margin:14px auto 24px;max-width:280px;line-height:1.6}
.m-banner .cta{flex-direction:column;gap:14px;align-items:center;width:100%}
.m-banner .btn-primary{width:205px;height:46px;border-radius:13px}
.m-banner .cta .link{background:none;border:none;color:var(--sec-text);font-size:14px;font-weight:600;font-family:inherit;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;cursor:pointer;padding:2px 6px;height:auto;width:auto}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.banner.show .txt>*{opacity:0;animation:rise .8s ease forwards}
.banner.show .txt>*:nth-child(1){animation-delay:.25s}
.banner.show .txt>*:nth-child(2){animation-delay:.4s}
.banner.show .txt>*:nth-child(3){animation-delay:.55s}

</style>
</head>
